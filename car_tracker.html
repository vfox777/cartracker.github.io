<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер замены деталей и жидкостей — Мульти-авто</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --danger: #e53935;
            --danger-hover: #b71c1c;
            --warning: #f9a825;
            --success: #2e7d32;
            --text: #1f1f1f;
            --text-secondary: #5f6368;
            --border: #e0e0e0;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.1);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header */
        .app-header {
            text-align: center;
            padding: 10px 0 5px;
        }
        .app-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .app-header h1 .icon {
            font-size: 2.2rem;
        }
        .app-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .global-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 10px;
        }

        /* Buttons */
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            background: #fff;
            color: #333;
            border: 1px solid #ddd;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
            border: none;
        }
        .btn-danger:hover {
            background: var(--danger-hover);
        }
        .btn-outline {
            background: #fff;
            color: var(--danger);
            border: 2px solid var(--danger);
        }
        .btn-outline:hover {
            background: #fff5f5;
        }
        .btn-sm {
            padding: 5px 10px;
            font-size: 0.75rem;
            border-radius: 6px;
        }

        /* Inputs and selects */
        input, select, textarea {
            font-family: inherit;
        }
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            background: #fafafa;
            color: var(--text);
            transition: var(--transition);
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }
        input::placeholder {
            color: #aaa;
        }

        /* Color input special styling */
        input[type="color"] {
            width: 48px;
            height: 42px;
            padding: 2px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: #fff;
            cursor: pointer;
            transition: var(--transition);
        }
        input[type="color"]:hover {
            border-color: var(--primary);
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 6px;
        }

        .note-input {
            padding: 8px 12px;
            font-size: 0.85rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            width: 100%;
        }
        .note-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(26,115,232,0.1);
        }

        /* Cars container spacing */
        #carsContainer {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* Car card */
        .car-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: var(--transition);
            border-left: 5px solid #ccc;
        }
        .car-card:hover {
            box-shadow: var(--shadow-lg);
        }
        .car-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            background: #fafbfc;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .car-color-badge {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        .car-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .car-plate {
            background: #f0f2f5;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #333;
            margin-left: 6px;
        }
        .car-header-actions {
            margin-left: auto;
            display: flex;
            gap: 6px;
        }

        .car-body {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mileage-row {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }
        .mileage-row .input-group {
            flex: 1;
            min-width: 180px;
        }
        .mileage-display {
            font-weight: 600;
            color: var(--primary);
            margin-top: 6px;
            font-size: 0.95rem;
        }

        .stats-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .stat-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .stat-badge.urgent {
            background: #fdecea;
            color: #c62828;
        }
        .stat-badge.soon {
            background: #fff8e1;
            color: #e65100;
        }
        .stat-badge.ok {
            background: #e8f5e9;
            color: #1b5e20;
        }
        .stat-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .stat-dot.red {
            background: #e53935;
        }
        .stat-dot.yellow {
            background: #f9a825;
        }
        .stat-dot.green {
            background: #43a047;
        }

        .add-item-form {
            background: #f9fafb;
            border-radius: var(--radius-sm);
            padding: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
            border: 1px dashed #ccc;
        }
        .add-item-form .input-group {
            flex: 1 1 180px;
        }
        .add-item-form label {
            font-size: 0.8rem;
            margin-bottom: 4px;
            display: block;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            white-space: nowrap;
            padding-bottom: 2px;
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 750px;
        }
        thead th {
            text-align: left;
            padding: 10px 10px;
            background: #f1f3f4;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
        }
        tbody td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tbody tr {
            transition: background 0.15s;
        }
        tbody tr:hover {
            background: #f8f9fa;
        }
        tbody tr.row-urgent {
            background: #fff5f5;
            border-left: 4px solid var(--danger);
        }
        tbody tr.row-soon {
            background: #fffef5;
            border-left: 4px solid var(--warning);
        }
        tbody tr.row-ok {
            border-left: 4px solid transparent;
        }

        .remaining-value {
            font-weight: 700;
        }
        .remaining-value.negative {
            color: #c62828;
        }
        .remaining-value.warning {
            color: #e65100;
        }
        .remaining-value.positive {
            color: #1b5e20;
        }
        .remaining-muted {
            color: #888;
        }
        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 2px;
        }
        .progress-bar-fill.danger {
            background: #e53935;
        }
        .progress-bar-fill.warning {
            background: #f9a825;
        }
        .progress-bar-fill.success {
            background: #43a047;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-secondary);
        }

        /* Modal overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: var(--radius);
            padding: 24px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .modal-content h3 {
            margin-bottom: 16px;
        }
        .modal-content .input-group {
            margin-bottom: 14px;
        }
        .modal-content label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        @media (max-width: 640px) {
            .car-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .car-header-actions {
                margin-left: 0;
            }
            .add-item-form {
                flex-direction: column;
            }
            .global-actions {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-header">
            <h1><span class="icon">🚗</span> Трекер замены деталей и жидкостей</h1>
            <p>Мульти-автомобильный менеджер обслуживания</p>
        </div>

        <div class="global-actions">
            <button class="btn btn-primary" onclick="openAddCarModal()">➕ Добавить автомобиль</button>
            <button class="btn" onclick="exportAllData()">📥 Экспорт всех данных</button>
            <button class="btn" onclick="document.getElementById('importFileInput').click()">📤 Импорт данных</button>
            <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="importAllData(event)">
        </div>

        <div id="carsContainer"></div>

        <div class="footer" style="text-align:center; font-size:0.8rem; color:var(--text-secondary); padding:10px;">
            Данные сохраняются автоматически в памяти браузера (localStorage) 🔒
        </div>
    </div>

    <!-- Модальное окно для добавления/редактирования авто -->
    <div class="modal" id="carModal">
        <div class="modal-content">
            <h3 id="carModalTitle">Новый автомобиль</h3>
            <div class="input-group">
                <label>Название</label>
                <input type="text" id="carNameInput" placeholder="Например: Kia Rio">
            </div>
            <div class="input-group">
                <label>Госномер</label>
                <input type="text" id="carPlateInput" placeholder="А123БВ 77">
            </div>
            <div class="input-group">
                <label>Цвет метки</label>
                <input type="color" id="carColorInput" value="#1a73e8">
            </div>
            <input type="hidden" id="editCarId">
            <div class="modal-actions">
                <button class="btn" onclick="closeCarModal()">Отмена</button>
                <button class="btn btn-primary" onclick="saveCar()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const STORAGE_KEY = 'carTracker_cars_v2';
            let cars = [];

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str || '';
                return div.innerHTML;
            }

            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
            }

            function loadData() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        cars = JSON.parse(saved);
                    } else {
                        const oldItems = localStorage.getItem('carTracker_items');
                        const oldMileage = localStorage.getItem('carTracker_currentMileage');
                        if (oldItems || oldMileage) {
                            let parsedItems = [];
                            try { if (oldItems) parsedItems = JSON.parse(oldItems); } catch(e){}
                            const defaultCar = {
                                id: generateId(),
                                name: 'Мой автомобиль',
                                color: '#1a73e8',
                                licensePlate: '',
                                currentMileage: oldMileage ? parseInt(oldMileage,10) : null,
                                items: Array.isArray(parsedItems) ? parsedItems : []
                            };
                            cars = [defaultCar];
                            localStorage.removeItem('carTracker_items');
                            localStorage.removeItem('carTracker_currentMileage');
                        } else {
                            cars = [];
                        }
                    }
                } catch (e) {
                    console.error('Ошибка загрузки:', e);
                    cars = [];
                }
            }

            function saveData() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(cars));
            }

            function renderAll() {
                const container = document.getElementById('carsContainer');
                if (!cars.length) {
                    container.innerHTML = `
                        <div style="text-align:center; padding:40px; border-radius:16px; background:#fff; box-shadow: var(--shadow);">
                            <span style="font-size:2.5rem;">🚘</span>
                            <p style="color:var(--text-secondary);">Нет добавленных автомобилей. Нажмите «Добавить автомобиль».</p>
                        </div>`;
                    return;
                }
                container.innerHTML = cars.map(car => renderCarCard(car)).join('');
            }

            function renderCarCard(car) {
                const mileage = car.currentMileage;
                const items = car.items || [];
                let countUrgent = 0, countSoon = 0, countOk = 0;
                items.forEach(item => {
                    if (item.intervalKm && mileage !== null && mileage >= 0) {
                        const next = item.lastMileage + item.intervalKm;
                        const rem = next - mileage;
                        if (rem <= 0) countUrgent++;
                        else if (rem <= item.intervalKm * 0.15) countSoon++;
                        else countOk++;
                    } else {
                        countOk++;
                    }
                });

                return `
                <div class="car-card" style="border-left: 5px solid ${escapeHtml(car.color)};" data-car-id="${car.id}">
                    <div class="car-header">
                        <div class="car-color-badge" style="background-color: ${escapeHtml(car.color)};"></div>
                        <div class="car-title">
                            ${escapeHtml(car.name)}
                            ${car.licensePlate ? `<span class="car-plate">${escapeHtml(car.licensePlate)}</span>` : ''}
                        </div>
                        <div class="car-header-actions">
                            <button class="btn btn-sm" onclick="editCar('${car.id}')">✏️</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCar('${car.id}')">🗑️</button>
                        </div>
                    </div>
                    <div class="car-body">
                        <div class="mileage-row">
                            <div class="input-group">
                                <label>Текущий пробег (км)</label>
                                <input type="number" id="mileage_${car.id}" value="${mileage !== null ? mileage : ''}" placeholder="Введите пробег" min="0">
                            </div>
                            <button class="btn btn-primary" onclick="updateCarMileage('${car.id}')">💾 Сохранить</button>
                        </div>
                        <div class="mileage-display" id="mileageDisplay_${car.id}">${mileage !== null ? '📌 Пробег: ' + mileage.toLocaleString('ru-RU') + ' км' : '⚠️ Укажите пробег'}</div>

                        <div class="stats-row">
                            <span class="stat-badge urgent"><span class="stat-dot red"></span> Требуют замены: <strong>${countUrgent}</strong></span>
                            <span class="stat-badge soon"><span class="stat-dot yellow"></span> Скоро: <strong>${countSoon}</strong></span>
                            <span class="stat-badge ok"><span class="stat-dot green"></span> В порядке: <strong>${countOk}</strong></span>
                        </div>

                        <div class="add-item-form">
                            <div class="input-group">
                                <label>Наименование</label>
                                <input type="text" id="itemName_${car.id}" placeholder="Деталь / жидкость">
                            </div>
                            <div class="input-group">
                                <label>Интервал (км)</label>
                                <input type="number" id="itemInterval_${car.id}" placeholder="10000" min="1">
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="noInterval_${car.id}" onchange="toggleIntervalInput('${car.id}')">
                                <label for="noInterval_${car.id}">Без интервала</label>
                            </div>
                            <div class="input-group">
                                <label>Пробег при замене (км)</label>
                                <input type="number" id="itemLastMileage_${car.id}" placeholder="110000" min="0">
                            </div>
                            <button class="btn btn-primary" onclick="addItemToCar('${car.id}')">➕ Добавить</button>
                        </div>

                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Наименование</th>
                                        <th>Интервал (км)</th>
                                        <th>Посл. замена (км)</th>
                                        <th>След. замена (км)</th>
                                        <th>Осталось (км)</th>
                                        <th>Примечание</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${items.length === 0 ? `
                                    <tr><td colspan="7"><div class="empty-state">Нет записей</div></td></tr>` : ''}
                                    ${items.map((item, idx) => renderItemRow(car, item, idx)).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            }

            function renderItemRow(car, item, index) {
                const interval = item.intervalKm;
                const last = item.lastMileage;
                const next = interval ? last + interval : null;
                let remainingText = '—';
                let rowClass = 'row-ok';
                let valueClass = '';
                let progressHtml = '';

                if (car.currentMileage !== null && car.currentMileage >= 0 && interval) {
                    const remaining = next - car.currentMileage;
                    const driven = car.currentMileage - last;
                    const percent = Math.min(100, Math.max(0, (driven / interval) * 100));
                    const progressClass = remaining <= 0 ? 'danger' : (remaining <= interval * 0.15 ? 'warning' : 'success');
                    if (remaining <= 0) {
                        rowClass = 'row-urgent';
                        valueClass = 'negative';
                        remainingText = `⚠️ Просрочено на ${Math.abs(remaining).toLocaleString('ru-RU')} км`;
                    } else if (remaining <= interval * 0.15) {
                        rowClass = 'row-soon';
                        valueClass = 'warning';
                        remainingText = `🔶 ${remaining.toLocaleString('ru-RU')} км`;
                    } else {
                        rowClass = 'row-ok';
                        valueClass = 'positive';
                        remainingText = `✅ ${remaining.toLocaleString('ru-RU')} км`;
                    }
                    progressHtml = `<div class="progress-bar-bg"><div class="progress-bar-fill ${progressClass}" style="width:${percent}%;"></div></div>`;
                }

                const note = item.note || '';

                return `
                <tr class="${rowClass}">
                    <td><strong>${escapeHtml(item.name)}</strong></td>
                    <td>${interval ? interval.toLocaleString('ru-RU') : '—'}</td>
                    <td>${last.toLocaleString('ru-RU')}</td>
                    <td>${next ? next.toLocaleString('ru-RU') : '—'}</td>
                    <td>
                        <span class="remaining-value ${valueClass}">${remainingText}</span>
                        ${progressHtml}
                    </td>
                    <td>
                        <input type="text" class="note-input" value="${escapeHtml(note)}" 
                               placeholder="Заметка" 
                               onchange="updateItemNote('${car.id}', ${index}, this.value)">
                    </td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteItemFromCar('${car.id}', ${index})">🗑️</button>
                    </td>
                </tr>`;
            }

            window.openAddCarModal = function() {
                document.getElementById('carModalTitle').textContent = 'Новый автомобиль';
                document.getElementById('editCarId').value = '';
                document.getElementById('carNameInput').value = '';
                document.getElementById('carPlateInput').value = '';
                document.getElementById('carColorInput').value = '#1a73e8';
                document.getElementById('carModal').classList.add('active');
            };

            window.editCar = function(carId) {
                const car = cars.find(c => c.id === carId);
                if (!car) return;
                document.getElementById('carModalTitle').textContent = 'Редактировать автомобиль';
                document.getElementById('editCarId').value = carId;
                document.getElementById('carNameInput').value = car.name;
                document.getElementById('carPlateInput').value = car.licensePlate || '';
                document.getElementById('carColorInput').value = car.color;
                document.getElementById('carModal').classList.add('active');
            };

            window.closeCarModal = function() {
                document.getElementById('carModal').classList.remove('active');
            };

            window.saveCar = function() {
                const name = document.getElementById('carNameInput').value.trim();
                const plate = document.getElementById('carPlateInput').value.trim();
                const color = document.getElementById('carColorInput').value;
                const editId = document.getElementById('editCarId').value;
                if (!name) { alert('Введите название автомобиля'); return; }
                if (editId) {
                    const car = cars.find(c => c.id === editId);
                    if (car) {
                        car.name = name;
                        car.licensePlate = plate;
                        car.color = color;
                    }
                } else {
                    cars.push({
                        id: generateId(),
                        name,
                        color,
                        licensePlate: plate,
                        currentMileage: null,
                        items: []
                    });
                }
                saveData();
                renderAll();
                closeCarModal();
            };

            window.deleteCar = function(carId) {
                const car = cars.find(c => c.id === carId);
                if (!car) return;
                if (confirm(`Удалить автомобиль "${car.name}" и все его записи?`)) {
                    cars = cars.filter(c => c.id !== carId);
                    saveData();
                    renderAll();
                }
            };

            window.updateCarMileage = function(carId) {
                const input = document.getElementById('mileage_' + carId);
                const value = parseInt(input.value, 10);
                const car = cars.find(c => c.id === carId);
                if (!car) return;
                if (isNaN(value) || value < 0) {
                    alert('Введите корректный пробег (число ≥ 0).');
                    return;
                }
                car.currentMileage = value;
                saveData();
                renderAll();
            };

            window.toggleIntervalInput = function(carId) {
                const checkbox = document.getElementById('noInterval_' + carId);
                const intervalInput = document.getElementById('itemInterval_' + carId);
                if (checkbox.checked) {
                    intervalInput.disabled = true;
                    intervalInput.value = '';
                    intervalInput.placeholder = 'Не используется';
                } else {
                    intervalInput.disabled = false;
                    intervalInput.placeholder = '10000';
                }
            };

            window.addItemToCar = function(carId) {
                const car = cars.find(c => c.id === carId);
                if (!car) return;
                const nameInput = document.getElementById('itemName_' + carId);
                const intervalInput = document.getElementById('itemInterval_' + carId);
                const noIntervalCheck = document.getElementById('noInterval_' + carId);
                const lastMileageInput = document.getElementById('itemLastMileage_' + carId);

                const name = nameInput.value.trim();
                let intervalKm = null;
                if (!noIntervalCheck.checked) {
                    intervalKm = parseInt(intervalInput.value, 10);
                    if (isNaN(intervalKm) || intervalKm <= 0) {
                        alert('Введите корректный интервал (положительное число) или отметьте «Без интервала».');
                        return;
                    }
                }
                const lastMileage = parseInt(lastMileageInput.value, 10);
                if (!name) { alert('Введите наименование'); return; }
                if (isNaN(lastMileage) || lastMileage < 0) { alert('Введите пробег последней замены'); return; }

                car.items.push({
                    name,
                    intervalKm,
                    lastMileage,
                    note: ''
                });
                saveData();
                renderAll();
                nameInput.value = '';
                intervalInput.value = '';
                lastMileageInput.value = '';
                noIntervalCheck.checked = false;
                intervalInput.disabled = false;
            };

            window.deleteItemFromCar = function(carId, index) {
                const car = cars.find(c => c.id === carId);
                if (!car) return;
                const item = car.items[index];
                if (confirm(`Удалить "${item.name}"?`)) {
                    car.items.splice(index, 1);
                    saveData();
                    renderAll();
                }
            };

            window.updateItemNote = function(carId, index, newNote) {
                const car = cars.find(c => c.id === carId);
                if (!car) return;
                if (car.items[index]) {
                    car.items[index].note = newNote;
                    saveData();
                }
            };

            window.exportAllData = function() {
                const data = { cars, exportDate: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'car-tracker-all-' + new Date().toISOString().slice(0,10) + '.json';
                a.click();
            };

            window.importAllData = function(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data.cars || !Array.isArray(data.cars)) throw new Error('Формат не поддерживается');
                        if (cars.length > 0 && !confirm('Импорт заменит все текущие данные. Продолжить?')) return;
                        cars = data.cars;
                        saveData();
                        renderAll();
                        alert('✅ Данные импортированы (' + cars.length + ' авто)');
                    } catch (err) {
                        alert('❌ Ошибка импорта: ' + err.message);
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            };

            window.onload = function() {
                loadData();
                renderAll();
                document.getElementById('carModal').addEventListener('click', function(e) {
                    if (e.target === this) closeCarModal();
                });
            };
        })();
    </script>
</body>
</html>
